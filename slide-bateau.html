<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sortie bateau</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0c2430; --panel:#0f2a36; --ink:#eef3f1; --muted:#9fb8be; --faint:#7f9ba3; --faint2:#5f7f89;
    --line:#23495a; --accent:#7cc4d6; --gold:#f2b544; --sea:#13455a; --land:#1d4a3a;
    --ok:#6fbf73; --okbg:rgba(111,191,115,0.16); --warn:#f2b544; --warnbg:rgba(242,181,68,0.16);
    --bad:#e86a5a; --badbg:rgba(232,106,90,0.18); --wind:#7cc4d6; --swell:#b58bd6;
  }
  :root[data-theme="light"] {
    --bg:#f2f6fb; --panel:#ffffff; --ink:#14254a; --muted:#55657f; --faint:#6b7a92; --faint2:#8b97aa;
    --line:#dde4ee; --accent:#2c5aa0; --gold:#e08a1e; --sea:#cfe1ec; --land:#d6e9d8;
    --ok:#2e8b57; --okbg:rgba(46,139,87,0.12); --warn:#e08a1e; --warnbg:rgba(224,138,30,0.14);
    --bad:#c0392b; --badbg:rgba(192,57,43,0.12); --wind:#2c5aa0; --swell:#8a4fbf;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Barlow", "Roboto", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: var(--bg);
           -webkit-transform-origin: 0 0; transform-origin: 0 0; -webkit-box-sizing: border-box; box-sizing: border-box; padding: 38px 48px; }
  .cond { font-family: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif; }

  #head { display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; }
  #title { -webkit-flex: 1; flex: 1; font-size: 48px; font-weight: 700; line-height: 1; }
  #place { font-size: 22px; color: var(--muted); margin-left: 16px; padding-bottom: 6px; }

  #verdict { margin-top: 20px; border-radius: 18px; padding: 18px 24px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  #verdict.ok { background: var(--okbg); } #verdict.warn { background: var(--warnbg); } #verdict.bad { background: var(--badbg); }
  #vDot { width: 20px; height: 20px; border-radius: 10px; margin-right: 18px; -webkit-flex: none; flex: none; }
  #verdict.ok #vDot { background: var(--ok); } #verdict.warn #vDot { background: var(--warn); } #verdict.bad #vDot { background: var(--bad); }
  #vTxt { -webkit-flex: 1; flex: 1; }
  #vTitle { font-size: 34px; font-weight: 700; line-height: 1; }
  #verdict.ok #vTitle { color: var(--ok); } #verdict.warn #vTitle { color: var(--warn); } #verdict.bad #vTitle { color: var(--bad); }
  #vReason { font-size: 19px; color: var(--muted); margin-top: 5px; }

  #body { display: -webkit-flex; display: flex; margin-top: 24px; }
  #left { -webkit-flex: 1; flex: 1; padding-right: 36px; }
  .metric { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .metric:first-child { padding-top: 0; }
  .mLbl { font-size: 17px; letter-spacing: 1px; color: var(--faint); text-transform: uppercase; font-weight: 600; }
  .mVal { font-size: 40px; font-weight: 700; line-height: 1.05; margin-top: 4px; }
  .mVal small { font-size: 22px; color: var(--muted); font-weight: 600; }
  .mSub { font-size: 19px; color: var(--muted); margin-top: 3px; }
  #advice { margin-top: 16px; font-size: 20px; color: var(--ink); }
  #advice b { color: var(--accent); }

  #map { width: 420px; -webkit-flex: none; flex: none; }
  #map svg { width: 420px; height: 420px; display: block; margin: 0 auto; }
  #mapLbl { text-align: center; font-size: 18px; color: var(--muted); margin-top: 6px; }

  #foot { position: absolute; left: 48px; right: 48px; bottom: 16px; font-size: 13px; color: var(--faint2); }
  #foot span { float: right; }
</style>
</head>
<body>
<div id="stage">
  <div id="head"><div id="title">Sortie bateau</div><div id="place">Port de la Gravette</div></div>

  <div id="verdict"><div id="vDot"></div><div id="vTxt"><div id="vTitle"></div><div id="vReason"></div></div></div>

  <div id="body">
    <div id="left">
      <div class="metric"><div class="mLbl">Vent</div><div class="mVal cond" id="windVal"></div><div class="mSub" id="windSub"></div></div>
      <div class="metric"><div class="mLbl">Houle / mer</div><div class="mVal cond" id="waveVal"></div><div class="mSub" id="waveSub"></div></div>
      <div id="advice"></div>
    </div>
    <div id="map"><div id="mapSvg"></div><div id="mapLbl">Flèche pleine = vent · pointillés = houle (d'où ça vient)</div></div>
  </div>

  <div id="foot">Vent &amp; houle : Open-Meteo (marine). Repères indicatifs, ne remplacent pas le bulletin météo marine (VHF / Météo-France).<span id="src"></span></div>
</div>

<script>
var LAT = 47.133, LON = -2.21;   /* Port de la Gravette / Pointe Saint-Gildas */
var WIND_LIMIT = 25;             /* ta limite perso en km/h */
var REFRESH_MIN = 20;

function el(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fr1(n) { return (Math.round(n * 10) / 10).toFixed(1).replace(".", ","); }

function sunTimes(date, lat, lon) {
  var rad = Math.PI / 180, deg = 180 / Math.PI, start = new Date(date.getFullYear(), 0, 0);
  var N = Math.floor((date - start) / 86400000);
  function calc(isRise) {
    var lngHour = lon / 15, t = N + ((isRise ? 6 : 18) - lngHour) / 24, M = (0.9856 * t) - 3.289;
    var L = M + (1.916 * Math.sin(rad * M)) + (0.020 * Math.sin(rad * 2 * M)) + 282.634; L = (L % 360 + 360) % 360;
    var RA = deg * Math.atan(0.91764 * Math.tan(rad * L)); RA = (RA % 360 + 360) % 360;
    RA = (RA + (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90)) / 15;
    var sinDec = 0.39782 * Math.sin(rad * L), cosDec = Math.cos(Math.asin(sinDec));
    var cosH = (Math.cos(rad * 90.833) - (sinDec * Math.sin(rad * lat))) / (cosDec * Math.cos(rad * lat));
    if (cosH > 1 || cosH < -1) return null;
    var H = (isRise ? 360 - deg * Math.acos(cosH) : deg * Math.acos(cosH)) / 15;
    var UT = ((H + RA - (0.06571 * t) - 6.622) % 24 + 24) % 24;
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0));
    d.setUTCMinutes(Math.round(UT * 60)); return d;
  }
  return { rise: calc(true), set: calc(false) };
}
function currentTheme() {
  var ov = (location.search.match(/theme=(light|dark)/) || [])[1]; if (ov) return ov;
  var now = new Date(), s = sunTimes(now, LAT, LON);
  if (!s.rise || !s.set) { var h = now.getHours(); return (h >= 8 && h < 20) ? "light" : "dark"; }
  return (now >= s.rise && now < s.set) ? "light" : "dark";
}
function applyTheme() { document.documentElement.setAttribute("data-theme", currentTheme()); }
function cv(name) { try { return getComputedStyle(document.documentElement).getPropertyValue(name).replace(/\s/g, "") || "#888"; } catch (e) { return "#888"; } }
function dirFr(deg) { if (deg == null) return ""; var d = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"]; return d[Math.round(((deg % 360) / 45)) % 8]; }

function seaState(h) { if (h < 0.1) return "Mer plate"; if (h < 0.5) return "Calme (ridée)"; if (h < 1.25) return "Peu agitée"; if (h < 2.5) return "Agitée"; if (h < 4) return "Forte"; return "Très forte"; }
function verdict(wind, wave) {
  if (wind <= WIND_LIMIT && wave <= 1.0) return { c: "ok", t: "Bon pour sortir", r: "Vent sous ta limite (" + WIND_LIMIT + " km/h), mer peu agitée" };
  if (wind <= WIND_LIMIT + 13 && wave <= 1.6) return { c: "warn", t: "Prudence", r: "Ça peut secouer — bien s'équiper, rester près" };
  return { c: "bad", t: "Déconseillé", r: "Vent fort ou mer formée — mieux vaut rester au port" };
}
function shelter(deg) {
  var c = dirFr(deg);
  if (c === "O" || c === "SO" || c === "NO") return 'Par ce vent, plus calme <b>au Sud de la pointe</b> (Préfailles, baie).';
  if (c === "S") return 'Par ce vent, plus abrité <b>au Nord de la pointe</b>.';
  return 'Vent de terre : <b>mer calme près de la côte</b>.';
}

var PORT = [294, 179];   /* port de la Gravette dans l'image 540x540 */
function drawMap(windDeg, swellDeg) {
  var S = 540, CX = 270, CY = 270, R = 262;
  function edge(bear) {
    var a = bear * Math.PI / 180, ux = Math.sin(a), uy = -Math.cos(a);
    var dx = PORT[0] - CX, dy = PORT[1] - CY;
    var b = 2 * (ux * dx + uy * dy), c = dx * dx + dy * dy - R * R;
    var t = (-b + Math.sqrt(b * b - 4 * c)) / 2;
    return [PORT[0] + t * ux, PORT[1] + t * uy];
  }
  function lerp(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; }
  function arrow(from, to, col, w, label, dashed) {
    var ang = Math.atan2(to[1] - from[1], to[0] - from[0]), hl = 17, ha = 0.5;
    var h1 = [to[0] - hl * Math.cos(ang - ha), to[1] - hl * Math.sin(ang - ha)];
    var h2 = [to[0] - hl * Math.cos(ang + ha), to[1] - hl * Math.sin(ang + ha)];
    var dash = dashed ? ' stroke-dasharray="3 8"' : '';
    var halo = '<line x1="' + from[0] + '" y1="' + from[1] + '" x2="' + to[0] + '" y2="' + to[1] + '" stroke="#ffffff" stroke-width="' + (w + 5) + '" stroke-linecap="round" opacity="0.9"/>';
    var ln = '<line x1="' + from[0] + '" y1="' + from[1] + '" x2="' + to[0] + '" y2="' + to[1] + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"' + dash + '/>';
    var hdHalo = '<path d="M' + to[0] + ' ' + to[1] + ' L' + h1[0] + ' ' + h1[1] + ' L' + h2[0] + ' ' + h2[1] + ' Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>';
    var hd = '<path d="M' + to[0] + ' ' + to[1] + ' L' + h1[0] + ' ' + h1[1] + ' L' + h2[0] + ' ' + h2[1] + ' Z" fill="' + col + '"/>';
    var lp = lerp(from, to, 0.15);
    var lb = '<text x="' + lp[0] + '" y="' + (lp[1] - 7) + '" fill="' + col + '" font-size="21" font-weight="800" text-anchor="middle" stroke="#ffffff" stroke-width="4" style="paint-order:stroke">' + label + '</text>';
    return halo + ln + hdHalo + hd + lb;
  }
  var s = '<defs><clipPath id="mclip"><circle cx="' + CX + '" cy="' + CY + '" r="' + R + '"/></clipPath></defs>';
  s += '<image href="' + MAP_IMG + '" xlink:href="' + MAP_IMG + '" x="0" y="0" width="540" height="540" preserveAspectRatio="xMidYMid slice" clip-path="url(#mclip)"/>';
  s += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="#ffffff" stroke-width="6"/>';
  s += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (R + 3) + '" fill="none" stroke="rgba(10,30,45,0.18)" stroke-width="2"/>';
  if (swellDeg != null) { var se = edge(swellDeg); s += arrow(lerp(PORT, se, 0.9), lerp(PORT, se, 0.16), "#8a3fb0", 5, "houle", true); }
  if (windDeg != null) { var we = edge(windDeg); s += arrow(we, lerp(PORT, we, 0.1), "#15467e", 7, "VENT", false); }
  return '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ' + S + ' ' + S + '" width="420" height="420">' + s + '</svg>';
}

var DATA = null, lastLoad = null;
function mock() { return { wind: 30, gust: 45, wdir: 225, wave: 1.1, period: 8, wdirW: 260, swellH: 0.9, swellP: 11, swellDir: 275 }; }

function render() {
  applyTheme();
  var d = DATA || mock();
  var v = verdict(d.wind, d.wave);
  el("verdict").className = v.c; el("vTitle").innerHTML = v.t; el("vReason").innerHTML = v.r;
  el("windVal").innerHTML = dirFr(d.wdir) + " " + Math.round(d.wind) + ' <small>km/h</small>';
  el("windSub").innerHTML = "Rafales " + Math.round(d.gust) + " km/h · " + Math.round(d.wind / 1.852) + " nds";
  el("waveVal").innerHTML = fr1(d.wave) + " m <small>· " + Math.round(d.period) + " s</small>";
  el("waveSub").innerHTML = seaState(d.wave) + " · houle d'" + dirFr(d.wdirW != null ? d.wdirW : d.wdir);
  el("advice").innerHTML = shelter(d.wdir);
  el("mapSvg").innerHTML = drawMap(d.wdir, (d.swellDir != null ? d.swellDir : d.wdirW));
  el("src").innerHTML = lastLoad ? "Maj " + hhmm(lastLoad) : "Exemple";
}

function loadWind() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&current=wind_speed_10m,wind_gusts_10m,wind_direction_10m&timezone=Europe%2FParis";
  var x = new XMLHttpRequest(); x.open("GET", url); x.timeout = 12000;
  x.onload = function () { if (x.status === 200) { try { var j = JSON.parse(x.responseText).current; DATA = DATA || {}; DATA.wind = j.wind_speed_10m; DATA.gust = j.wind_gusts_10m; DATA.wdir = j.wind_direction_10m; lastLoad = new Date(); render(); } catch (e) {} } };
  x.send();
}
function loadMarine() {
  var url = "https://marine-api.open-meteo.com/v1/marine?latitude=" + LAT + "&longitude=" + LON + "&current=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction&timezone=Europe%2FParis";
  var x = new XMLHttpRequest(); x.open("GET", url); x.timeout = 12000;
  x.onload = function () { if (x.status === 200) { try { var j = JSON.parse(x.responseText).current; DATA = DATA || {}; DATA.wave = j.wave_height; DATA.period = j.wave_period; DATA.wdirW = j.wave_direction; DATA.swellH = j.swell_wave_height; DATA.swellP = j.swell_wave_period; DATA.swellDir = j.swell_wave_direction; lastLoad = new Date(); render(); } catch (e) {} } };
  x.send();
}
function loadAll() { loadWind(); loadMarine(); }

function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800), st = el("stage").style;
  st.webkitTransform = st.transform = "scale(" + s + ")";
  st.left = ((window.innerWidth - 1280 * s) / 2) + "px";
  st.top = ((window.innerHeight - 800 * s) / 2) + "px";
}
window.onresize = fit; fit(); applyTheme();

render();
loadAll();
setInterval(loadAll, REFRESH_MIN * 60000);
</script>

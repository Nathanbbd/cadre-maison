<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marées, La Plaine-sur-Mer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Thème clair/sombre via variables CSS (OK sur WebView Chrome 106). */
  :root {
    --bg:#0c2430; --panel:#0f2a36; --ink:#eef3f1; --muted:#9fb8be; --faint:#7f9ba3;
    --faint2:#5f7f89; --water:#2e6f86; --wave:#7cc4d6; --sand:#d9c9a3; --gold:#f2b544;
    --line:#23495a; --goldbg:rgba(242,181,68,0.12);
  }
  :root[data-theme="light"] {
    --bg:#f2f6fb; --panel:#ffffff; --ink:#14254a; --muted:#55657f; --faint:#6b7a92;
    --faint2:#8b97aa; --water:#8fb9c9; --wave:#2c5aa0; --sand:#b0894a; --gold:#e08a1e;
    --line:#d5dce6; --goldbg:rgba(224,138,30,0.14);
  }

  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Barlow", "Roboto", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage {
    position: absolute; left: 0; top: 0; width: 1280px; height: 800px;
    background: var(--panel); -webkit-transform-origin: 0 0; transform-origin: 0 0;
  }
  .cond { font-family: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif; }

  #top { display: -webkit-flex; display: flex; padding: 44px 56px 0; height: 250px; box-sizing: border-box; }
  #state { -webkit-flex: 1; flex: 1; }
  #place { font-size: 22px; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
  #trend { font-size: 64px; line-height: 1; margin: 0; font-weight: 600; letter-spacing: -0.5px; }
  #trend .arrow { color: var(--wave); margin-right: 10px; }
  #next { font-size: 26px; color: var(--sand); margin: 18px 0 0; }
  #next b { color: var(--ink); font-weight: 600; }

  #now { width: 230px; text-align: right; padding-top: 6px; }
  #height { font-size: 112px; line-height: 0.9; font-weight: 600; }
  #height small { font-size: 40px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  #heightLbl { font-size: 18px; color: var(--muted); margin-top: 8px; }

  #coef {
    width: 170px; margin-left: 40px; height: 170px; border-radius: 85px;
    border: 3px solid var(--water); text-align: center; box-sizing: border-box; padding-top: 26px;
  }
  #coef.big { border-color: var(--gold); background: var(--goldbg); }
  #coefVal { font-size: 78px; line-height: 1; font-weight: 700; }
  #coef.big #coefVal { color: var(--gold); }
  #coefLbl { font-size: 17px; color: var(--muted); margin-top: 4px; }

  #curveWrap { position: relative; height: 330px; margin: 0 56px; }
  #curve { display: block; }

  #days { display: -webkit-flex; display: flex; margin: 10px 56px 0; height: 150px; }
  .day { -webkit-flex: 1; flex: 1; padding: 14px 0 0 16px; border-left: 1px solid var(--line); }
  .day:first-child { border-left: 0; padding-left: 0; }
  .dName { font-size: 19px; color: var(--muted); font-weight: 500; }
  .dCoefs { font-size: 40px; font-weight: 600; margin-top: 4px; white-space: nowrap; }
  .dCoefs span { display: inline-block; min-width: 58px; }
  .dCoefs .gm { color: var(--gold); }
  .dPm { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .dBm { font-size: 16px; color: var(--faint); margin-top: 1px; }

  #credit { position: absolute; left: 56px; bottom: 14px; font-size: 13px; color: var(--faint2); }
  #updated { position: absolute; right: 56px; bottom: 14px; font-size: 13px; color: var(--faint2); }
</style>
</head>
<body>
<div id="stage">
  <div id="top">
    <div id="state">
      <p id="place">La Plaine-sur-Mer</p>
      <p id="trend"></p>
      <p id="next"></p>
    </div>
    <div id="now">
      <div id="height" class="cond"></div>
      <div id="heightLbl">hauteur d'eau</div>
    </div>
    <div id="coef">
      <div id="coefVal" class="cond"></div>
      <div id="coefLbl">coefficient</div>
    </div>
  </div>

  <div id="curveWrap"><svg id="curve" width="1168" height="330"></svg></div>

  <div id="days"></div>

  <div id="credit">Marées : api-maree.fr (CC BY), harmoniques Ifremer / PREVIMER. Prédictions, pas pour la navigation.</div>
  <div id="updated"></div>
</div>

<script>
var DATA_URL = "https://maree.boisbourdinnathande.workers.dev/";
var REFRESH_DATA_MIN = 30;
var DAYS_SHOWN = 6;
var LAT = 47.1375, LON = -2.1876;

/* ---------- thème jour/nuit auto (lever/coucher du soleil) ---------- */
function sunTimes(date, lat, lon) {
  var rad = Math.PI / 180, deg = 180 / Math.PI;
  var start = new Date(date.getFullYear(), 0, 0);
  var N = Math.floor((date - start) / 86400000);
  function calc(isRise) {
    var lngHour = lon / 15;
    var t = N + ((isRise ? 6 : 18) - lngHour) / 24;
    var M = (0.9856 * t) - 3.289;
    var L = M + (1.916 * Math.sin(rad * M)) + (0.020 * Math.sin(rad * 2 * M)) + 282.634;
    L = (L % 360 + 360) % 360;
    var RA = deg * Math.atan(0.91764 * Math.tan(rad * L));
    RA = (RA % 360 + 360) % 360;
    RA = RA + (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90);
    RA = RA / 15;
    var sinDec = 0.39782 * Math.sin(rad * L);
    var cosDec = Math.cos(Math.asin(sinDec));
    var cosH = (Math.cos(rad * 90.833) - (sinDec * Math.sin(rad * lat))) / (cosDec * Math.cos(rad * lat));
    if (cosH > 1 || cosH < -1) return null;
    var H = isRise ? 360 - deg * Math.acos(cosH) : deg * Math.acos(cosH);
    H = H / 15;
    var T = H + RA - (0.06571 * t) - 6.622;
    var UT = ((T - lngHour) % 24 + 24) % 24;
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0));
    d.setUTCMinutes(Math.round(UT * 60));
    return d;
  }
  return { rise: calc(true), set: calc(false) };
}
function currentTheme() {
  var ov = (location.search.match(/theme=(light|dark)/) || [])[1];
  if (ov) return ov;  /* ?theme=light ou ?theme=dark pour prévisualiser */
  var now = new Date(), s = sunTimes(now, LAT, LON);
  if (!s.rise || !s.set) { var h = now.getHours(); return (h >= 8 && h < 20) ? "light" : "dark"; }
  return (now >= s.rise && now < s.set) ? "light" : "dark";
}
var PAL = {
  dark:  { sand:"#d9c9a3", water:"#2e6f86", wave:"#7cc4d6", grid:"#ffffff", gridOp:"0.06",
           ink:"#eef3f1", muted:"#9fb8be", faint:"#7f9ba3", gold:"#f2b544", panel:"#0f2a36" },
  light: { sand:"#b0894a", water:"#8fb9c9", wave:"#2c5aa0", grid:"#14254a", gridOp:"0.08",
           ink:"#14254a", muted:"#55657f", faint:"#6b7a92", gold:"#e08a1e", panel:"#f7f9fb" }
};
function C(k) { return PAL[currentTheme()][k]; }
function applyTheme() { document.documentElement.setAttribute("data-theme", currentTheme()); }

/* ---------- utilitaires ---------- */
var JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fr(n, dec) { return n.toFixed(dec).replace(".", ","); }
function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function el(id) { return document.getElementById(id); }

function flatten(payload) {
  var out = [];
  for (var i = 0; i < payload.data.length; i++) {
    var day = payload.data[i];
    var p = day.date.split("-");
    for (var j = 0; j < day.extrema.length; j++) {
      var e = day.extrema[j], t = e.time.split(":");
      out.push({ type: e.type, height: e.height, coef: e.coef,
        date: new Date(+p[0], +p[1] - 1, +p[2], +t[0], +t[1]) });
    }
  }
  out.sort(function (a, b) { return a.date - b.date; });
  return out;
}

function heightAt(ext, t) {
  for (var i = 0; i < ext.length - 1; i++) {
    var a = ext[i], b = ext[i + 1];
    if (t >= a.date && t <= b.date) {
      var f = (t - a.date) / (b.date - a.date);
      return a.height + (b.height - a.height) * (1 - Math.cos(Math.PI * f)) / 2;
    }
  }
  return null;
}

function mockPayload() {
  var start = new Date(); start.setHours(0, 0, 0, 0);
  start = new Date(start.getTime() - 86400000);
  var H = 3600000, M2 = 12.4206 * H, SPRING = 14.765 * 24 * H;
  function h(t) {
    var x = t - start.getTime();
    var amp = 1.95 + 0.85 * Math.cos(2 * Math.PI * (x + 3 * 86400000) / SPRING);
    return 3.15 + amp * Math.cos(2 * Math.PI * (x - 4 * H) / M2);
  }
  var step = 5 * 60000, ext = [], prev = h(start.getTime() - step), cur = h(start.getTime());
  for (var t = start.getTime(); t < start.getTime() + 9 * 86400000; t += step) {
    var nxt = h(t + step);
    if (cur > prev && cur >= nxt) ext.push({ type: "PM", t: t, height: cur });
    if (cur < prev && cur <= nxt) ext.push({ type: "BM", t: t, height: cur });
    prev = cur; cur = nxt;
  }
  for (var i = 0; i < ext.length; i++) {
    if (ext[i].type !== "PM") continue;
    var lo = ext[i + 1] || ext[i - 1];
    var c = Math.round(15.4 * (ext[i].height - lo.height) + 20);
    ext[i].coef = Math.max(20, Math.min(120, c));
  }
  var days = {}, order = [];
  for (var k = 0; k < ext.length; k++) {
    var d = new Date(ext[k].t), key = ymd(d);
    if (!days[key]) { days[key] = []; order.push(key); }
    var item = { type: ext[k].type, time: hhmm(d), height: Math.round(ext[k].height * 1000) / 1000 };
    if (ext[k].coef) item.coef = ext[k].coef;
    days[key].push(item);
  }
  var data = [];
  for (var n = 0; n < order.length; n++) data.push({ date: order[n], extrema: days[order[n]] });
  return { site_id: "demo", site_name: "La Plaine-sur-Mer", timezone: "Europe/Paris", unit: "m", data: data };
}

/* ---------- rendu ---------- */
var EXT = [], lastLoad = null;

function renderTop(now) {
  var next = null, prev = null;
  for (var i = 0; i < EXT.length; i++) {
    if (EXT[i].date > now) { next = EXT[i]; prev = EXT[i - 1]; break; }
  }
  if (!next || !prev) return;
  var rising = next.type === "PM";
  el("trend").innerHTML = '<span class="arrow">' + (rising ? "&#8599;" : "&#8600;") + "</span>" +
    (rising ? "Marée montante" : "Marée descendante");
  var mins = Math.round((next.date - now) / 60000);
  var dur = mins >= 60 ? Math.floor(mins / 60) + " h " + pad(mins % 60) : mins + " min";
  el("next").innerHTML = (rising ? "Pleine mer" : "Basse mer") + " à <b>" + hhmm(next.date) +
    "</b>, " + fr(next.height, 2) + " m, dans " + dur;
  var hNow = heightAt(EXT, now);
  el("height").innerHTML = fr(hNow, 1) + "<small>m</small>";
  var pm = rising ? next : prev;
  el("coefVal").innerHTML = pm.coef || "–";
  el("coef").className = (pm.coef >= 95) ? "big" : "";
}

function renderCurve(now) {
  var svg = el("curve"), W = 1168, Hh = 330, top = 46, bottom = 286;
  var t0 = now.getTime() - 6 * 3600000, t1 = now.getTime() + 18 * 3600000;
  var lo = 0, hi = 6.2;
  function X(t) { return (t - t0) / (t1 - t0) * W; }
  function Y(h) { return bottom - (h - lo) / (hi - lo) * (bottom - top); }

  var pts = [], s = "";
  for (var t = t0; t <= t1; t += 10 * 60000) {
    var h = heightAt(EXT, new Date(t));
    if (h !== null) pts.push(X(t).toFixed(1) + "," + Y(h).toFixed(1));
  }
  s += '<rect x="0" y="' + bottom + '" width="' + W + '" height="' + (Hh - bottom) + '" fill="' + C("sand") + '" opacity="0.10"/>';
  s += '<polygon points="0,' + bottom + " " + pts.join(" ") + " " + W + "," + bottom + '" fill="' + C("water") + '" opacity="0.55"/>';
  s += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + C("wave") + '" stroke-width="3"/>';

  var first = new Date(t0); first.setMinutes(0, 0, 0);
  for (var g = first.getTime(); g <= t1; g += 3600000) {
    var gd = new Date(g);
    if (g < t0 || gd.getHours() % 3) continue;
    var gx = X(g);
    s += '<line x1="' + gx + '" x2="' + gx + '" y1="' + top + '" y2="' + bottom + '" stroke="' + C("grid") + '" stroke-opacity="' + C("gridOp") + '"/>';
    var lbl = gd.getHours() === 0 ? JOURS[gd.getDay()] : pad(gd.getHours()) + "h";
    s += '<text x="' + gx + '" y="' + (bottom + 28) + '" fill="' + C("faint") + '" font-size="16" text-anchor="middle">' + lbl + "</text>";
  }

  for (var i = 0; i < EXT.length; i++) {
    var e = EXT[i], t2 = e.date.getTime();
    if (t2 < t0 || t2 > t1) continue;
    var ex = X(t2), ey = Y(e.height), isPM = e.type === "PM";
    var anchor = ex < 60 ? "start" : (ex > W - 60 ? "end" : "middle");
    s += '<circle cx="' + ex + '" cy="' + ey + '" r="5" fill="' + (isPM ? C("ink") : C("sand")) + '"/>';
    var ty = isPM ? ey - 16 : ey + 30;
    s += '<text x="' + ex + '" y="' + ty + '" fill="' + C("ink") + '" font-size="20" font-weight="600" text-anchor="' + anchor + '">' +
      (isPM ? "PM " : "BM ") + hhmm(e.date) + "</text>";
    s += '<text x="' + ex + '" y="' + (ty + (isPM ? -22 : 20)) + '" fill="' + C("muted") + '" font-size="15" text-anchor="' + anchor + '">' +
      fr(e.height, 2) + " m" + (isPM && e.coef ? ", coef " + e.coef : "") + "</text>";
  }

  var nx = X(now.getTime()), ny = Y(heightAt(EXT, now));
  s += '<line x1="' + nx + '" x2="' + nx + '" y1="' + (top - 30) + '" y2="' + bottom + '" stroke="' + C("gold") + '" stroke-width="2"/>';
  s += '<circle cx="' + nx + '" cy="' + ny + '" r="9" fill="' + C("gold") + '" stroke="' + C("panel") + '" stroke-width="3"/>';
  s += '<text x="' + (nx + 10) + '" y="' + (top - 16) + '" fill="' + C("gold") + '" font-size="16" font-weight="600">' + hhmm(now) + "</text>";

  svg.innerHTML = s;
}

function renderDays(now) {
  var pm = {}, bm = {}, keys = [], today = ymd(now);
  for (var i = 0; i < EXT.length; i++) {
    var e = EXT[i], k = ymd(e.date);
    if (k < today) continue;
    if (e.type === "PM") {
      if (!pm[k]) { pm[k] = []; if (keys.indexOf(k) === -1) keys.push(k); }
      pm[k].push(e);
    } else {
      if (!bm[k]) bm[k] = [];
      bm[k].push(e);
    }
  }
  keys.sort();
  var html = "";
  for (var d = 0; d < Math.min(DAYS_SHOWN, keys.length); d++) {
    var key = keys[d], listPM = pm[key] || [], listBM = bm[key] || [];
    var date = (listPM[0] || listBM[0]).date;
    var name = d === 0 ? "Aujourd'hui" : (d === 1 ? "Demain" : JOURS[date.getDay()] + " " + date.getDate());
    var coefs = "", timesPM = [], timesBM = [];
    for (var j = 0; j < listPM.length; j++) {
      coefs += '<span class="' + (listPM[j].coef >= 95 ? "gm" : "") + '">' + (listPM[j].coef || "–") + "</span>";
      timesPM.push(hhmm(listPM[j].date));
    }
    for (var b = 0; b < listBM.length; b++) timesBM.push(hhmm(listBM[b].date));
    html += '<div class="day"><div class="dName">' + name + '</div><div class="dCoefs cond">' + coefs +
      '</div><div class="dPm">PM ' + timesPM.join(" et ") +
      '</div><div class="dBm">BM ' + timesBM.join(" et ") + "</div></div>";
  }
  el("days").innerHTML = html;
}

function render() {
  applyTheme();
  if (!EXT.length) return;
  var now = new Date();
  renderTop(now); renderCurve(now); renderDays(now);
  el("updated").innerHTML = DATA_URL ? "Données du " + hhmm(lastLoad) : "Données simulées (démo)";
}

function load() {
  if (!DATA_URL) { EXT = flatten(mockPayload()); lastLoad = new Date(); render(); return; }
  var xhr = new XMLHttpRequest();
  xhr.open("GET", DATA_URL);
  xhr.timeout = 15000;
  function retry() { if (!EXT.length) setTimeout(load, 60000); }
  xhr.onload = function () {
    if (xhr.status === 200) {
      try { EXT = flatten(JSON.parse(xhr.responseText)); lastLoad = new Date(); render(); return; } catch (e) {}
    }
    retry();
  };
  xhr.onerror = retry;
  xhr.ontimeout = retry;
  xhr.send();
}

function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
  var st = el("stage").style;
  st.webkitTransform = st.transform = "scale(" + s + ")";
  st.left = ((window.innerWidth - 1280 * s) / 2) + "px";
  st.top = ((window.innerHeight - 800 * s) / 2) + "px";
}
window.onresize = fit; fit();

applyTheme();
load();
setInterval(render, 60000);
setInterval(load, REFRESH_DATA_MIN * 60000);
</script>
</body>
</html>

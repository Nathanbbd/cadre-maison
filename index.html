<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadre maison — La Plaine-sur-Mer</title>
<style>
  /* Shell du diaporama. Compatible WebView Android 6 / Chrome 106 :
     flexbox uniquement, pas de grid, pas de variables CSS. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Roboto", "Helvetica Neue", Arial, sans-serif; }

  /* Slides : plein écran, superposées, fondu. La barre est par-dessus (overlay),
     donc les slides ne sont PAS rétrécies. */
  .slide {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    border: 0; opacity: 0; -webkit-transition: opacity 0.6s ease; transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .slide.on { opacity: 1; pointer-events: auto; }

  /* Barre de navigation en HAUT (superposée, fine, translucide) */
  #nav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
    background: rgba(10,22,30,0.72);
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: row; flex-direction: row;
    z-index: 10;
  }
  /* 3 rectangles égaux, chacun un tiers de la largeur, icône centrée */
  .navBtn {
    -webkit-flex: 1; flex: 1; height: 100%;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    cursor: pointer; border-right: 1px solid rgba(255,255,255,0.14);
    -webkit-transition: background 0.25s ease; transition: background 0.25s ease;
  }
  .navBtn:last-child { border-right: 0; }
  .navBtn svg { width: 22px; height: 22px; display: block; }
  .navBtn .ic { fill: none; stroke: #cdd9de; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .navBtn.active { background: #2e6f86; }
  .navBtn.active .ic { stroke: #ffffff; }

  /* Liseré de progression : fine ligne sous la barre, se remplit sur 30 s */
  #prog { position: absolute; bottom: 40px; left: 0; right: 0; height: 2px; z-index: 11; }
  #progFill { height: 100%; width: 0; background: #7cc4d6; }
</style>
</head>
<body>

  <!-- Ordre : marées, météo, voiture (retour) -->
  <iframe class="slide" id="s0" src="slide-marees.html"></iframe>
  <iframe class="slide" id="s1" src="meteo-mariniere.html"></iframe>
  <iframe class="slide" id="s2" src="slide-retour.html"></iframe>

  <div id="nav">
    <div class="navBtn" data-i="0" title="Marées">
      <svg viewBox="0 0 24 24"><path class="ic" d="M2 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2M2 20c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/></svg>
    </div>
    <div class="navBtn" data-i="1" title="Météo marine">
      <svg viewBox="0 0 24 24"><circle class="ic" cx="9" cy="8.5" r="3"/><path class="ic" d="M9 3.6v1.5M4.1 8.5h1.5M5.3 4.8l1.1 1.1M12.7 4.8l-1.1 1.1"/><path class="ic" d="M7.5 19h9.3a3.1 3.1 0 0 0 .1-6.2 4 4 0 0 0-7.6-1A3.3 3.3 0 0 0 7.5 19z"/></svg>
    </div>
    <div class="navBtn" data-i="2" title="Retour">
      <svg viewBox="0 0 24 24"><path class="ic" d="M3 15v-2.6l2.2-4.1a1.6 1.6 0 0 1 1.4-.8h6.3a1.6 1.6 0 0 1 1.2.6L17.9 11H20a1 1 0 0 1 1 1v3"/><path class="ic" d="M3 15h2.2M9.4 15h5.2M18.8 15H21M8 11h6.2"/><circle class="ic" cx="7.3" cy="15.2" r="1.8"/><circle class="ic" cx="16.7" cy="15.2" r="1.8"/></svg>
    </div>
  </div>
  <div id="prog"><div id="progFill"></div></div>

<script>
/* ---------- réglages ---------- */
var ROTATE_MS = 30000;   /* 30 s par slide */
var N = 3;

var cur = -1, timer = null, start = 0;
var slides = [document.getElementById("s0"), document.getElementById("s1"), document.getElementById("s2")];
var btns = document.getElementsByClassName("navBtn");
var progFill = document.getElementById("progFill");

function show(i) {
  if (i === cur) { restart(); return; }
  cur = i;
  for (var k = 0; k < N; k++) {
    if (k === i) { slides[k].className = "slide on"; btns[k].className = "navBtn active"; }
    else { slides[k].className = "slide"; btns[k].className = "navBtn"; }
  }
  restart();
}

function next() { show((cur + 1) % N); }

function restart() {
  start = Date.now();
  if (timer) clearTimeout(timer);
  timer = setTimeout(next, ROTATE_MS);
}

function loop() {
  var f = Math.min(1, (Date.now() - start) / ROTATE_MS);
  progFill.style.width = (f * 100) + "%";
  window.requestAnimationFrame ? requestAnimationFrame(loop) : setTimeout(loop, 100);
}

for (var k = 0; k < N; k++) {
  (function (idx) { btns[idx].onclick = function () { show(idx); }; })(k);
}

show(0);
loop();
</script>
</body>
</html>

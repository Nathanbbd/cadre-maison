<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aujourd'hui</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f1ea; --panel:#fbfaf6; --ink:#2e2b26; --muted:#8d877b; --faint:#a8a192;
    --faint2:#bdb6a6; --line:#e8e3d7; --yellow:#f2b600; --yellowsoft:rgba(242,182,0,0.16);
    --accent:#b7791f; --soon:#d98324;
  }
  :root[data-theme="dark"] {
    --bg:#1b1a16; --panel:#201e19; --ink:#f2ede1; --muted:#b3ab99; --faint:#8f887a;
    --faint2:#6f685c; --line:#332f27; --yellow:#f2b600; --yellowsoft:rgba(242,182,0,0.18);
    --accent:#f2b600; --soon:#f0a24a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Barlow", "Roboto", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: var(--bg);
           -webkit-transform-origin: 0 0; transform-origin: 0 0; padding: 30px 40px; -webkit-box-sizing: border-box; box-sizing: border-box;
           display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; }
  .lbl { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-bottom: 10px; }

  /* ---------- haut : horloge + météo ---------- */
  #top { display: -webkit-flex; display: flex; height: 208px; -webkit-flex: none; flex: none; }
  #clockbox { width: 340px; -webkit-flex: none; flex: none; }
  #clock { font-size: 88px; font-weight: 800; line-height: 0.9; letter-spacing: -2px; }
  #date { font-size: 23px; color: var(--muted); margin-top: 10px; text-transform: capitalize; }

  #weather { -webkit-flex: 1; flex: 1; margin-left: 24px; padding: 16px 24px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  #wcTop { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; }
  #wcLeft { -webkit-flex: 1; flex: 1; }
  #wcCity { font-size: 20px; font-weight: 600; color: var(--muted); }
  #wcTemp { font-size: 58px; font-weight: 700; line-height: 0.95; }
  #wcTemp span { font-size: 26px; vertical-align: 26px; color: var(--muted); }
  #wcRight { text-align: right; padding-top: 4px; }
  #wcCond { font-size: 24px; font-weight: 600; }
  #wcHL { font-size: 21px; color: var(--muted); margin-top: 4px; }
  #wcHL b { color: var(--ink); font-weight: 600; }
  #wcHours { display: -webkit-flex; display: flex; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .hr { -webkit-flex: 1; flex: 1; text-align: center; padding: 3px 0; border-radius: 10px; }
  .hr .hl { font-size: 14px; color: var(--muted); }
  .hr .hi { height: 30px; margin: 2px 0 1px; }
  .hr .ht { font-size: 18px; font-weight: 600; }
  .hr.sun .hl { color: var(--accent); font-weight: 600; }
  .hr.now { background: var(--yellowsoft); }
  .hr.now .hl { color: var(--soon); font-weight: 700; }
  #rainAlert { display: none; margin-top: 10px; background: var(--yellowsoft); border-radius: 12px;
               padding: 9px 16px; font-size: 19px; font-weight: 500; color: var(--ink);
               -webkit-align-items: center; align-items: center; }
  #rainAlert.show { display: -webkit-flex; display: flex; }
  #rainAlert svg { width: 24px; height: 24px; -webkit-flex: none; flex: none; margin-right: 12px; }
  #rainAlert svg path { fill: none; stroke: var(--soon); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- milieu : scènes | photos | agenda ---------- */
  #mid { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; margin-top: 20px; min-height: 0; }
  #scenes { width: 352px; -webkit-flex: none; flex: none; padding: 18px 20px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  #scgrid { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -7px; }
  .scn { width: calc(50% - 14px); -webkit-box-sizing: border-box; box-sizing: border-box; margin: 7px; background: var(--bg); border: 1px solid var(--line); border-radius: 18px;
         display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
         font-size: 20px; font-weight: 600; color: var(--ink); -webkit-user-select: none; user-select: none; cursor: pointer; text-align: center; padding: 6px; }
  .scn.act { background: var(--yellow); border-color: var(--yellow); color: #2e2b26; }

  #photos { -webkit-flex: 1; flex: 1; margin: 0 20px; border-radius: 22px; overflow: hidden; position: relative; background: #14120e; }
  .ph { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-position: center; background-repeat: no-repeat; background-size: cover;
        opacity: 0; -webkit-transition: opacity 1.2s ease; transition: opacity 1.2s ease; }
  .ph.on { opacity: 1; }
  #phelp { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
           display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
           text-align: center; color: var(--faint); font-size: 16px; padding: 0 26px; line-height: 1.5; }
  #phelp b { color: var(--accent); }

  #agenda { width: 388px; -webkit-flex: none; flex: none; padding: 18px 22px; overflow: hidden; }
  .agday { font-size: 18px; font-weight: 700; margin: 11px 0 3px; }
  .agday.first { margin-top: 0; }
  .agev { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; font-size: 15px; padding: 2px 0; }
  .agev .dot { width: 4px; height: 22px; border-radius: 2px; background: var(--accent); margin-right: 9px; -webkit-flex: none; flex: none; -webkit-align-self: center; align-self: center; }
  .agev .t { color: var(--muted); width: 62px; -webkit-flex: none; flex: none; }
  .agnone { font-size: 14px; color: var(--faint); padding: 2px 0 2px 13px; }

  /* ---------- bas : 3 trajets ---------- */
  #trajets { -webkit-flex: none; flex: none; height: 128px; display: -webkit-flex; display: flex; margin-top: 20px; }
  .tc { -webkit-flex: 1; flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
        padding: 0 18px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; min-width: 0; }
  .tc + .tc { margin-left: 18px; }
  .tcIcon { width: 44px; height: 44px; border-radius: 13px; background: var(--yellowsoft); -webkit-flex: none; flex: none;
            display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; margin-right: 14px; }
  .tcIcon svg { width: 25px; height: 25px; }
  .tcIcon .ic { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tcMid { -webkit-flex: 1; flex: 1; min-width: 0; }
  .tcName { font-size: 23px; font-weight: 700; line-height: 1; }
  .tcDest { font-size: 15px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcRight { text-align: right; -webkit-flex: none; flex: none; margin-left: 10px; }
  .tcArr { font-size: 38px; font-weight: 800; line-height: 1; }
  .tcDep { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .tcWarn { color: var(--soon); font-weight: 700; }
</style>
</head>
<body>
<div id="stage">

  <div id="top">
    <div id="clockbox"><div id="clock"></div><div id="date"></div></div>
    <div id="weather" class="panel">
      <div id="wcTop">
        <div id="wcLeft"><div id="wcCity">Levallois-Perret</div><div id="wcTemp"></div></div>
        <div id="wcRight"><div id="wcCond"></div><div id="wcHL"></div></div>
      </div>
      <div id="wcHours"></div>
      <div id="rainAlert"></div>
    </div>
  </div>

  <div id="mid">
    <div id="scenes" class="panel">
      <div class="lbl">Scènes</div>
      <div id="scgrid">
        <div class="scn" onclick="scene('scene1',this)">Scène 1</div>
        <div class="scn" onclick="scene('scene2',this)">Scène 2</div>
        <div class="scn" onclick="scene('scene3',this)">Scène 3</div>
        <div class="scn" onclick="scene('scene4',this)">Scène 4</div>
      </div>
    </div>

    <div id="photos">
      <div class="ph" id="ph0"></div>
      <div class="ph" id="ph1"></div>
      <div id="phelp">Ajoutez vos photos dans <b>photos.json</b><br>pour les faire défiler ici.</div>
    </div>

    <div id="agenda" class="panel">
      <div class="lbl">Agenda</div>
      <div id="agList"></div>
    </div>
  </div>

  <div id="trajets"></div>

</div>

<script>
var AGENDA_URL = "";
var TRANSIT_URL = "https://transit-appart.boisbourdinnathande.workers.dev";
var LIGHT_URL = "https://tuya-appart.boisbourdinnathande.workers.dev";
var LAT = 48.8938, LON = 2.2870;
var REFRESH_MIN = 15;

var ICONS = {
  person: '<svg viewBox="0 0 24 24"><circle class="ic" cx="12" cy="8" r="4"/><path class="ic" d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>',
  school: '<svg viewBox="0 0 24 24"><path class="ic" d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path class="ic" d="M6.5 11.3V16c0 1.4 2.5 2.7 5.5 2.7s5.5-1.3 5.5-2.7v-4.7"/><path class="ic" d="M21.5 9.5v4.5"/></svg>',
  work: '<svg viewBox="0 0 24 24"><rect class="ic" x="3" y="7.5" width="18" height="12" rx="2"/><path class="ic" d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5"/><path class="ic" d="M3 12.5h18"/></svg>'
};
var DEFAULT_TRJ = [
  { icon: "person", name: "Jade",   dest: "Travail · Transavia", arrive: "08:58", depart: "07:51", alert: null },
  { icon: "school", name: "Nathan", dest: "École · INSEEC",       arrive: "08:46", depart: "08:03", alert: null },
  { icon: "work",   name: "Nathan", dest: "Travail · AB InBev",   arrive: "08:40", depart: "07:59", alert: null }
];

function el(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

function currentTheme() { var ov = (location.search.match(/theme=(light|dark)/) || [])[1]; return ov || "light"; }
function applyTheme() { document.documentElement.setAttribute("data-theme", currentTheme()); }
function C(k) {
  var P = { light: { sun:"#f2b600", cloud:"#b4ac9c", rain:"#5b8fb0", snow:"#9aa0a6", bolt:"#f2b600" },
            dark:  { sun:"#f2b600", cloud:"#8f887a", rain:"#7cc4d6", snow:"#dfeaee", bolt:"#f2b600" } };
  return P[currentTheme()][k];
}

/* ---------- scènes ---------- */
function scene(name, btn) {
  var ss = document.getElementById("scgrid").getElementsByClassName("scn"), i;
  for (i = 0; i < ss.length; i++) ss[i].className = ss[i].className.replace(/\s*act/g, "");
  btn.className += " act";
  setTimeout(function () { btn.className = btn.className.replace(/\s*act/g, ""); }, 1500);
  if (!LIGHT_URL) return;
  try { var xhr = new XMLHttpRequest(); xhr.open("GET", LIGHT_URL + "?scene=" + encodeURIComponent(name)); xhr.timeout = 8000; xhr.send(); } catch (e) {}
}

/* ---------- photos (défilé, même source que la slide Photos) ---------- */
var MANIFEST = "photos.json", HOLD_MS = 8000, PLIST = [], pidx = -1, player = 0, photosStarted = false;
function psrc(n) { return (/^https?:\/\//.test(n)) ? n : ("photos/" + n); }
function nextPhoto() {
  if (!PLIST.length) return;
  pidx = (pidx + 1) % PLIST.length;
  var show = player ? "ph1" : "ph0", hide = player ? "ph0" : "ph1";
  el(show).style.backgroundImage = 'url("' + psrc(PLIST[pidx]) + '")';
  el(show).className = "ph on"; el(hide).className = "ph";
  player = player ? 0 : 1;
}
function startPhotos(list) {
  PLIST = list || [];
  if (!PLIST.length) { el("phelp").style.display = "flex"; return; }
  el("phelp").style.display = "none";
  if (photosStarted) return; photosStarted = true;
  nextPhoto(); setInterval(nextPhoto, HOLD_MS);
}
function loadPhotos() {
  var x = new XMLHttpRequest(); x.open("GET", MANIFEST + "?t=" + Date.now()); x.timeout = 10000;
  x.onload = function () { var list = []; if (x.status === 200) { try { var j = JSON.parse(x.responseText); if (j instanceof Array) list = j; else if (j && j.photos) list = j.photos; } catch (e) {} } startPhotos(list); };
  x.onerror = function () { startPhotos([]); };
  x.ontimeout = function () { startPhotos([]); };
  x.send();
}

/* ---------- icônes météo ---------- */
function wIcon(code, px) {
  var s = C("sun"), c = C("cloud"), r = C("rain"), sn = C("snow"), b = C("bolt");
  function sun(cx, cy, rr) {
    var o = '<circle cx="' + cx + '" cy="' + cy + '" r="' + rr + '" fill="' + s + '"/>';
    for (var i = 0; i < 8; i++) { var a = i * Math.PI / 4, x1 = cx + Math.cos(a) * (rr + 6), y1 = cy + Math.sin(a) * (rr + 6), x2 = cx + Math.cos(a) * (rr + 13), y2 = cy + Math.sin(a) * (rr + 13); o += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + s + '" stroke-width="6" stroke-linecap="round"/>'; }
    return o;
  }
  var cloud = '<path d="M38 84h50a19 19 0 0 0 2-38 26 26 0 0 0-50-6 21 21 0 0 0-2 44z" fill="' + c + '"/>';
  var g = '';
  if (code === 0 || code === 1) g = sun(64, 62, 30);
  else if (code === 2) g = sun(44, 46, 22) + cloud;
  else if (code === 3) g = cloud;
  else if (code === 45 || code === 48) g = cloud + '<line x1="34" y1="94" x2="94" y2="94" stroke="' + c + '" stroke-width="6" stroke-linecap="round"/><line x1="40" y1="104" x2="88" y2="104" stroke="' + c + '" stroke-width="6" stroke-linecap="round"/>';
  else if (code >= 51 && code <= 67) g = cloud + '<line x1="46" y1="92" x2="40" y2="108" stroke="' + r + '" stroke-width="6" stroke-linecap="round"/><line x1="64" y1="92" x2="58" y2="108" stroke="' + r + '" stroke-width="6" stroke-linecap="round"/><line x1="82" y1="92" x2="76" y2="108" stroke="' + r + '" stroke-width="6" stroke-linecap="round"/>';
  else if (code >= 71 && code <= 77) g = cloud + '<circle cx="50" cy="100" r="4" fill="' + sn + '"/><circle cx="68" cy="100" r="4" fill="' + sn + '"/>';
  else if (code >= 80 && code <= 82) g = cloud + '<line x1="46" y1="92" x2="40" y2="110" stroke="' + r + '" stroke-width="7" stroke-linecap="round"/><line x1="66" y1="92" x2="60" y2="110" stroke="' + r + '" stroke-width="7" stroke-linecap="round"/><line x1="86" y1="92" x2="80" y2="110" stroke="' + r + '" stroke-width="7" stroke-linecap="round"/>';
  else if (code >= 95) g = cloud + '<path d="M60 90l-10 16h10l-8 14" fill="none" stroke="' + b + '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>';
  else g = cloud;
  return '<svg viewBox="0 0 128 128" width="' + px + '" height="' + px + '">' + g + '</svg>';
}
function moonIcon(code, px) {
  var m = (currentTheme() === "dark") ? "#e8dfae" : "#c9a227", c = C("cloud");
  var moon = '<path d="M78 64a30 30 0 1 1-30-30 24 24 0 0 0 30 30z" fill="' + m + '"/>';
  if (code === 2) { var cloud = '<path d="M42 90h46a17 17 0 0 0 2-34 24 24 0 0 0-30-10 19 19 0 0 0-18 44z" fill="' + c + '"/>'; return '<svg viewBox="0 0 128 128" width="' + px + '" height="' + px + '"><path d="M70 50a22 22 0 1 1-22-22 18 18 0 0 0 22 22z" fill="' + m + '"/>' + cloud + '</svg>'; }
  return '<svg viewBox="0 0 128 128" width="' + px + '" height="' + px + '">' + moon + '</svg>';
}
function sunsetIcon(px) {
  var s = C("sun"), m = C("cloud");
  var g = '<g>'
    + '<path d="M44 86a20 20 0 0 1 40 0" fill="' + s + '"/>'
    + '<line x1="30" y1="92" x2="98" y2="92" stroke="' + m + '" stroke-width="6" stroke-linecap="round"/>'
    + '<line x1="64" y1="40" x2="64" y2="58" stroke="' + s + '" stroke-width="6" stroke-linecap="round"/>'
    + '<path d="M54 50l10 10 10-10" fill="none" stroke="' + s + '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'
    + '</g>';
  return '<svg viewBox="0 0 128 128" width="' + px + '" height="' + px + '">' + g + '</svg>';
}
function condText(code) {
  if (code === 0) return "Ciel dégagé";
  if (code === 1) return "Plutôt dégagé";
  if (code === 2) return "Nuageux";
  if (code === 3) return "Couvert";
  if (code === 45 || code === 48) return "Brouillard";
  if (code >= 51 && code <= 57) return "Bruine";
  if (code >= 61 && code <= 67) return "Pluie";
  if (code >= 71 && code <= 77) return "Neige";
  if (code >= 80 && code <= 82) return "Averses";
  if (code >= 95) return "Orage";
  return "—";
}

var WX = null, AG = null, TRJ = null, lastLoad = null;

function mockAgenda() {
  return { days: [
    { label: "Aujourd'hui", events: [{ t: "en cours", title: "Restaurant" }] },
    { label: "Demain", events: [] },
    { label: "Mardi 17", events: [{ t: "09 h 00", title: "Inventaire Liberté" }] },
    { label: "Jeudi 19", events: [{ t: "13 h 30", title: "Visio Touraine" }] },
    { label: "Vendredi 20", events: [{ t: "20 h 00", title: "Concert Bigflo & Oli" }] }
  ] };
}

function renderWeather() {
  if (!WX) { el("wcCond").innerHTML = "Météo indisponible"; return; }
  el("wcTemp").innerHTML = Math.round(WX.temp) + "<span>°</span>";
  el("wcCond").innerHTML = condText(WX.code);
  el("wcHL").innerHTML = "&#8593; <b>" + Math.round(WX.tmax) + "°</b>&nbsp;&nbsp;&#8595; <b>" + Math.round(WX.tmin) + "°</b>";
  var ra = el("rainAlert"), umb = '<svg viewBox="0 0 24 24"><path d="M12 4V2.4"/><path d="M4 11a8 8 0 0 1 16 0z"/><path d="M12 11v7a2.2 2.2 0 0 0 4.3 0.6"/></svg>';
  if (WX.rain) {
    ra.className = "show";
    if (WX.rain.now) ra.innerHTML = umb + "Il pleut en ce moment — pense au parapluie";
    else ra.innerHTML = umb + "Pluie attendue vers " + WX.rain.hour + " h — prends un parapluie" + (WX.rain.prob != null ? " (" + WX.rain.prob + "%)" : "");
  } else { ra.className = ""; ra.innerHTML = ""; }
  var h = "", cols = WX.cols || [];
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], ic;
    if (col.type === "sunset" || col.type === "sunrise") ic = sunsetIcon(30);
    else if (col.night && col.code <= 2) ic = moonIcon(col.code, 30);
    else ic = wIcon(col.code, 30);
    var tt = (col.temp == null) ? "" : (Math.round(col.temp) + "°");
    var cls = "hr" + (col.type !== "hour" ? " sun" : "") + (col.now ? " now" : "");
    h += '<div class="' + cls + '"><div class="hl">' + col.label + '</div><div class="hi">' + ic + '</div><div class="ht">' + tt + '</div></div>';
  }
  el("wcHours").innerHTML = h;
}

function renderAgenda() {
  var ag = AG || mockAgenda(), days = ag.days || [], h = "";
  for (var i = 0; i < days.length; i++) {
    var d = days[i];
    h += '<div class="agday' + (i === 0 ? " first" : "") + '">' + d.label + '</div>';
    if (d.events && d.events.length) {
      for (var j = 0; j < d.events.length; j++) {
        var e = d.events[j];
        h += '<div class="agev"><span class="dot"></span>' + (e.t ? '<span class="t">' + e.t + '</span>' : '') + e.title + '</div>';
      }
    } else h += '<div class="agnone">Rien de prévu</div>';
  }
  el("agList").innerHTML = h;
}

function renderTrajets() {
  var list = (TRJ && TRJ.trips && TRJ.trips.length) ? TRJ.trips : DEFAULT_TRJ;
  var h = "";
  for (var i = 0; i < list.length && i < 3; i++) {
    var t = list[i];
    h += '<div class="tc">' +
      '<div class="tcIcon">' + (ICONS[t.icon] || ICONS.person) + '</div>' +
      '<div class="tcMid"><div class="tcName">' + t.name + '</div>' +
        '<div class="tcDest">' + t.dest + (t.alert ? ' · <span class="tcWarn">&#9888; ' + t.alert + '</span>' : '') + '</div></div>' +
      '<div class="tcRight"><div class="tcArr">' + t.arrive + '</div><div class="tcDep">partir ' + t.depart + '</div></div>' +
      '</div>';
  }
  el("trajets").innerHTML = h;
}

function render() {
  applyTheme();
  var now = new Date();
  el("clock").innerHTML = hhmm(now);
  el("date").innerHTML = JOURS[now.getDay()] + " " + now.getDate() + " " + MOIS[now.getMonth()];
  renderWeather();
  renderAgenda();
  renderTrajets();
}

/* ---------- météo : courant + heures + coucher du soleil (6 h → minuit) ---------- */
function buildCols(j) {
  var H = j.hourly, now = new Date(), i;
  function findHour(y, mo, da, hh) {
    for (var k = 0; k < H.time.length; k++) {
      var d = new Date(H.time[k]);

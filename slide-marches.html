<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marchés</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0c2430; overflow: hidden; }
  body { font-family: "Barlow", "Roboto", "Helvetica Neue", Arial, sans-serif; color: #eef3f1; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: #0f2a36;
           -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  .cond { font-family: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif; }

  #head { padding: 40px 56px 6px; }
  #title { font-size: 56px; font-weight: 600; margin: 0; line-height: 1; }
  #season { font-size: 22px; color: #9fb8be; margin-top: 10px; font-weight: 500; }

  #body { display: -webkit-flex; display: flex; margin: 22px 56px 0; }

  /* Bloc "aujourd'hui" à gauche */
  #today { width: 470px; padding-right: 44px; }
  #todayLbl { font-size: 20px; color: #7f9ba3; text-transform: uppercase; letter-spacing: 1px; }
  .tMarket { margin-top: 18px; }
  .tVille { font-size: 46px; font-weight: 600; line-height: 1; }
  .tInfo { font-size: 22px; color: #d9c9a3; margin-top: 6px; }
  #noneToday { font-size: 34px; font-weight: 600; color: #9fb8be; margin-top: 18px; line-height: 1.2; }
  #nextUp { font-size: 24px; color: #d9c9a3; margin-top: 16px; }
  #nextUp b { color: #eef3f1; }

  /* Semaine à droite */
  #week { -webkit-flex: 1; flex: 1; border-left: 1px solid #23495a; padding-left: 40px; }
  .wRow { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline;
          padding: 9px 0; border-bottom: 1px solid #16323f; }
  .wRow.now { background: rgba(124,196,214,0.10); border-radius: 8px; padding-left: 10px; margin-left: -10px; }
  .wDay { width: 130px; font-size: 24px; font-weight: 600; color: #9fb8be; -webkit-flex: none; flex: none; }
  .wRow.now .wDay { color: #7cc4d6; }
  .wVilles { font-size: 24px; }
  .wVilles .none { color: #4f6b74; }
  .wVilles .sep { color: #4f6b74; margin: 0 8px; }

  #foot { position: absolute; left: 56px; right: 56px; bottom: 14px; font-size: 13px; color: #5f7f89; }
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <h1 id="title">Marchés du coin</h1>
    <div id="season"></div>
  </div>

  <div id="body">
    <div id="today">
      <div id="todayLbl">Aujourd'hui</div>
      <div id="todayList"></div>
    </div>
    <div id="week"></div>
  </div>

  <div id="foot">Horaires indicatifs. Marchés d'été (juillet–août) différents du reste de l'année — pensez à vérifier un jour férié.</div>
</div>

<script>
/* Données statiques — jours de la semaine façon JS : 0=dim … 6=sam.
   ete  = jours en saison estivale (juillet/août)
   hors = jours le reste de l'année (vide = pas de marché hors saison) */
var MARKETS = [
  { ville: "La Plaine-sur-Mer", lieu: "rue de la Croix Mouraud", h: "9h–13h", ete: [4, 0], hors: [] },
  { ville: "Pornic",            lieu: "Vieux Port",              h: "matin",  ete: [4, 0], hors: [4, 0] },
  { ville: "Préfailles",        lieu: "Place du marché",         h: "8h–13h", ete: [3, 6], hors: [3, 6] },
  { ville: "Tharon-Plage",      lieu: "Place du Marché",         h: "matin",  ete: [2, 5], hors: [6] }
];

var JOURS = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
var ORDER = [1, 2, 3, 4, 5, 6, 0]; /* affichage lundi → dimanche */
function el(id) { return document.getElementById(id); }

function isSummer(d) { var m = d.getMonth() + 1; return m === 7 || m === 8; }
function daysOf(mk, summer) { return summer ? mk.ete : mk.hors; }
function marketsOn(day, summer) {
  var out = [];
  for (var i = 0; i < MARKETS.length; i++) {
    if (daysOf(MARKETS[i], summer).indexOf(day) >= 0) out.push(MARKETS[i]);
  }
  return out;
}

function render() {
  var now = new Date(), summer = isSummer(now), today = now.getDay();
  el("season").innerHTML = summer ? "Saison estivale (juillet–août)" : "Hors saison";

  /* Aujourd'hui */
  var tm = marketsOn(today, summer), html = "";
  if (tm.length) {
    for (var i = 0; i < tm.length; i++) {
      html += '<div class="tMarket"><div class="tVille">' + tm[i].ville + '</div>' +
              '<div class="tInfo">' + tm[i].h + " · " + tm[i].lieu + "</div></div>";
    }
  } else {
    html = '<div id="noneToday">Pas de marché aujourd\'hui</div>';
    for (var k = 1; k <= 7; k++) {
      var d = (today + k) % 7, nm = marketsOn(d, summer);
      if (nm.length) {
        var noms = [];
        for (var j = 0; j < nm.length; j++) noms.push(nm[j].ville);
        var quand = k === 1 ? "demain" : JOURS[d].toLowerCase();
        html += '<div id="nextUp">Prochain : <b>' + quand + "</b> — " + noms.join(", ") + "</div>";
        break;
      }
    }
  }
  el("todayList").innerHTML = html;

  /* Semaine */
  var w = "";
  for (var o = 0; o < ORDER.length; o++) {
    var day = ORDER[o], mk = marketsOn(day, summer), cls = (day === today) ? "wRow now" : "wRow";
    var villes;
    if (mk.length) {
      var parts = [];
      for (var p = 0; p < mk.length; p++) parts.push(mk[p].ville);
      villes = parts.join('<span class="sep">·</span>');
    } else {
      villes = '<span class="none">—</span>';
    }
    w += '<div class="' + cls + '"><div class="wDay">' + JOURS[day] + '</div><div class="wVilles">' + villes + "</div></div>";
  }
  el("week").innerHTML = w;
}

function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800), st = el("stage").style;
  st.webkitTransform = st.transform = "scale(" + s + ")";
  st.left = ((window.innerWidth - 1280 * s) / 2) + "px";
  st.top = ((window.innerHeight - 800 * s) / 2) + "px";
}
window.onresize = fit; fit();

render();
setInterval(render, 10 * 60000); /* re-rendu pour suivre le changement de jour */
</script>
</body>
</html>

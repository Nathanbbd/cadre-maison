<script>
/* En production : DATA_URL = URL du Worker "peche". Vide = données simulées. */
var DATA_URL = "https://peche.boisbourdinnathande.workers.dev/";
var REFRESH_MIN = 180;   /* le bulletin ne change qu'aux alentours de toutes les 2 semaines */

function el(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }

var DATA = null, lastLoad = null;

function render() {
  var d = DATA || { status: "ok", date: "(démo)", excerpt: "" };
  var dot = el("dot"), txt = el("statusTxt"), exc = el("excerpt");
  if (d.status === "interdit") {
    dot.style.background = "#e86a5a";
    txt.innerHTML = "Zone interdite";
    exc.innerHTML = d.excerpt ? "« …" + d.excerpt + "… »" : "Pêche à pied déconseillée / interdite sur ta zone.";
  } else if (d.status === "inconnu") {
    dot.style.background = "#f2b544";
    txt.innerHTML = "À vérifier";
    exc.innerHTML = "Impossible de lire le dernier bulletin — scanne le QR pour la carte ARS.";
  } else {
    dot.style.background = "#6fbf73";
    txt.innerHTML = "Rien de signalé";
    exc.innerHTML = "Aucune interdiction détectée sur ta zone dans le dernier bulletin.";
  }
  el("date").innerHTML = d.date ? "Dernier bulletin : <b style='color:#eef3f1'>" + d.date + "</b>" : "";
  el("src").innerHTML = DATA_URL ? (lastLoad ? "Vérifié à " + hhmm(lastLoad) : "") : "Données simulées (démo)";
}

function load() {
  if (!DATA_URL) { DATA = { status: "ok", date: "(démo)", excerpt: "" }; lastLoad = new Date(); render(); return; }
  var xhr = new XMLHttpRequest();
  xhr.open("GET", DATA_URL);
  xhr.timeout = 15000;
  function retry() { if (!DATA) setTimeout(load, 60000); }
  xhr.onload = function () {
    if (xhr.status === 200) {
      try { DATA = JSON.parse(xhr.responseText); lastLoad = new Date(); render(); return; } catch (e) {}
    }
    retry();
  };
  xhr.onerror = retry;
  xhr.ontimeout = retry;
  xhr.send();
}

function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800), st = el("stage").style;
  st.webkitTransform = st.transform = "scale(" + s + ")";
  st.left = ((window.innerWidth - 1280 * s) / 2) + "px";
  st.top = ((window.innerHeight - 800 * s) / 2) + "px";
}
window.onresize = fit; fit();

render();
load();
setInterval(load, REFRESH_MIN * 60000);
</script>
